<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#231c17">
  <meta name="description" content="看小票选鱼料，卷切或捏握寿司，经营你的街角寿司吧。">
  <title>海苔小摊</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script defer src="rules.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <main id="app" class="app" data-view="home">
    <header class="masthead">
      <h1>海苔小摊</h1>
      <div class="header-controls">
        <span id="day-label"></span>
        <button id="pause-button" type="button" class="pause-button" data-action="pause" aria-label="暂停" hidden><span aria-hidden="true"></span></button>
      </div>
    </header>

    <section id="home" class="screen home" aria-label="选择营业日"></section>

    <section id="shift" class="screen shift" aria-label="备餐台" hidden>
      <div class="orders-wrap"><div id="orders" class="orders" aria-label="当前订单"></div></div>
      <section class="station" aria-label="当前制作步骤">
        <div class="station-header">
          <span id="step-label" class="step-label"></span>
          <button id="rice" class="rice" type="button" data-action="rice"></button>
        </div>
        <div id="board" class="board"></div>
        <p id="step-hint" class="step-hint"></p>
      </section>
      <section id="controls" class="controls" aria-label="制作操作"></section>
      <div id="toast" class="toast" role="status" hidden></div>
    </section>

    <section id="report" class="screen report" aria-label="营业结算" hidden></section>
    <p id="save-note" class="save-note" hidden>当前浏览器无法保留游戏进度</p>
    <noscript>开启 JavaScript 后即可营业。</noscript>
  </main>

  <dialog id="pause-menu" class="pause-menu" aria-labelledby="pause-title">
    <h2 id="pause-title">营业暂停</h2>
    <button class="primary" type="button" data-action="resume" autofocus>继续营业</button>
    <button class="secondary" type="button" data-action="home">返回选日</button>
  </dialog>
</body>
</html>
