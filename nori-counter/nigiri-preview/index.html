<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1511">
  <meta name="description" content="在寿司吧台亲手做一贯少饭中腹，再试一贯甜虾。">
  <title>海苔小摊 · 握寿司试玩</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./counter.css">
</head>
<body>
  <main id="counter" class="counter" aria-label="海苔小摊握寿司试玩">
    <div class="diner" aria-hidden="true"></div>
    <canvas id="table" aria-label="寿司吧台" aria-describedby="instruction"></canvas>
    <header class="order">
      <div class="order-copy">
        <p class="brand">海苔小摊</p>
        <h1 id="dish">金枪鱼中腹</h1>
        <p id="portion" class="portion">客人要少饭</p>
      </div>
      <button id="reset" class="reset" type="button" aria-label="重做这一贯" title="重做这一贯" disabled>↻</button>
    </header>
    <div id="guide" class="guide" aria-hidden="true" hidden>
      <span class="guide-line"></span>
      <span class="guide-ring"></span>
    </div>
    <div class="foot">
      <p id="instruction" class="instruction" role="status">正在准备吧台…</p>
      <section id="reaction" class="reaction" aria-label="客人反馈" hidden>
        <p id="response" role="status"></p>
        <button id="next" type="button">再做一贯<span aria-hidden="true"> ↗</span></button>
      </section>
      <noscript>开启 JavaScript 后即可开始试玩。</noscript>
    </div>
  </main>
  <script type="module" src="./counter.mjs"></script>
</body>
</html>
